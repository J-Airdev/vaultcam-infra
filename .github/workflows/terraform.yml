name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev

    steps:
      - name: Check out the code
        uses: actions/checkout@v6
      
      - name: Show OIDC subject (temporary)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "import sys,base64,json; s=sys.stdin.read().strip(); s+='='*(-len(s)%4); print(json.loads(base64.urlsafe_b64decode(s))['sub'])"  

      - name: Sign in to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::105299590519:role/vaultcam-github-deploy
          aws-region: eu-west-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16.0"

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialise
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      
      - name: Apply (main branch only)
        if: github.event_name == 'push'
        run: terraform apply -input=false tfplan